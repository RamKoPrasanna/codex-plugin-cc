name: Upstream Sync

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      UPSTREAM_URL: https://github.com/openai/codex-plugin-cc.git
      SYNC_BRANCH: upstream-sync
      ISSUE_TITLE: "Upstream sync: manual merge needed"
      PR_TITLE: "Sync upstream openai/codex-plugin-cc main"

    # This job never installs, builds, or runs code from the merged tree; pull-request-ci.yml
    # does that on the dispatched upstream-sync ref. Commit subjects and file names from upstream
    # are untrusted: they only reach files read with --body-file / -F body=@, never ${{ }} or eval.
    steps:
      - name: Check out fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with upstream
        id: compare
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          behind="$(git rev-list --count origin/main..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          # Backticks are swapped out so each untrusted subject stays inside its code span,
          # which also keeps @mentions in upstream subjects from notifying anyone.
          quote="'"
          commits_file="$RUNNER_TEMP/upstream-commits.md"
          git log --format='%h%x09%s' --max-count=200 origin/main..upstream/main |
            while IFS=$'\t' read -r sha subject; do
              printf -- "- \`%s\` \`%s\`\n" "$sha" "${subject//\`/$quote}"
            done > "$commits_file"
          if [ "$behind" -gt 200 ]; then
            printf -- '- ... and %s more\n' "$((behind - 200))" >> "$commits_file"
          fi
          echo "Upstream main has $behind commit(s) not in fork main."

      - name: Merge upstream into sync branch
        id: merge
        if: steps.compare.outputs.behind != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          lease="$(git rev-parse --verify --quiet "refs/remotes/origin/$SYNC_BRANCH" || true)"
          echo "lease=$lease" >> "$GITHUB_OUTPUT"

          quote="'"
          git switch -C "$SYNC_BRANCH" origin/main
          if ! git merge --no-ff --no-edit -m "Merge upstream openai/codex-plugin-cc main" upstream/main; then
            git diff --name-only --diff-filter=U |
              while IFS= read -r file; do printf -- "- \`%s\`\n" "${file//\`/$quote}"; done > "$RUNNER_TEMP/blocked-files.md"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::Merging upstream main conflicts; reporting in an issue instead of pushing."
            exit 0
          fi

          # GITHUB_TOKEN cannot be granted the workflows permission, so GitHub refuses any push
          # whose commits touch .github/workflows.
          workflow_files="$(git log --format= --name-only origin/main..HEAD -- .github/workflows | sort -u)"
          if [ -n "$workflow_files" ]; then
            printf '%s\n' "$workflow_files" |
              while IFS= read -r file; do printf -- "- \`%s\`\n" "${file//\`/$quote}"; done > "$RUNNER_TEMP/blocked-files.md"
            echo "status=workflows" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream changes workflow files, which GITHUB_TOKEN cannot push; reporting in an issue."
            exit 0
          fi

          # Only a branch whose tree is exactly the fresh merge counts as current; anything else
          # (including extra commits pushed to it) is regenerated, so the PR never carries
          # unreviewed changes under the bot's description and always gets CI.
          if [ -n "$lease" ] && [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$lease^{tree}")" ]; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            echo "$SYNC_BRANCH already matches the merge of upstream main into fork main; leaving it as is."
            exit 0
          fi

          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          LEASE: ${{ steps.merge.outputs.lease }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git push --force-with-lease="refs/heads/$SYNC_BRANCH:$LEASE" origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Report blocked merge in an issue
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'workflows'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-body.md"
          {
            if [ "$STATUS" = "conflict" ]; then
              echo "Merging upstream \`openai/codex-plugin-cc\` main into fork main conflicts, so \`$SYNC_BRANCH\` was not pushed."
              echo
              echo "## Conflicting files"
            else
              echo "Upstream changes workflow files. \`GITHUB_TOKEN\` cannot push those, so \`$SYNC_BRANCH\` was not pushed."
              echo
              echo "## Workflow files changed upstream"
            fi
            echo
            cat "$RUNNER_TEMP/blocked-files.md"
            echo
            echo "## Upstream commits not in fork main"
            echo
            cat "$RUNNER_TEMP/upstream-commits.md"
            echo
            echo "Merge locally: \`git fetch https://github.com/openai/codex-plugin-cc.git main && git merge FETCH_HEAD\`."
            echo "Keep the fork's own changes: the \`ram-codex\` marketplace name, the fork version, Daybreak support, and security-review."
          } > "$body"

          issues="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.ISSUE_TITLE) | .number')"
          issue="${issues%%$'\n'*}"
          if [ -n "$issue" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -F "body=@$body" > /dev/null
            echo "Updated issue #$issue."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f "title=$ISSUE_TITLE" -F "body=@$body" --jq '.html_url'
          fi

      - name: Open or update pull request
        if: steps.merge.outputs.status == 'merged' || steps.merge.outputs.status == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Upstream \`openai/codex-plugin-cc\` main has commits that fork main does not. \`$SYNC_BRANCH\` merges them into fork main (a merge commit, so fork changes are kept)."
            echo
            echo "## Upstream commits"
            echo
            cat "$RUNNER_TEMP/upstream-commits.md"
            echo
            echo "## Fork changes to keep"
            echo
            echo "This fork carries its own changes: the \`ram-codex\` marketplace name, the fork version, Daybreak support, and security-review. Keep them when resolving or reviewing."
            echo
            echo "CI runs via \`workflow_dispatch\` on \`$SYNC_BRANCH\`, since pull requests opened with \`GITHUB_TOKEN\` do not trigger \`pull_request\` workflows. The branch is regenerated from fork main when upstream or fork main moves; make fix-ups on another branch."
          } > "$body"

          # --head matches the branch name from any fork, so only a PR from this repository counts.
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --state open \
            --json number,headRepositoryOwner --jq '.[] | select(.headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER) | .number')"
          pr="${prs%%$'\n'*}"
          if [ -n "$pr" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F "body=@$body" > /dev/null
            echo "Updated pull request #$pr."
          elif ! output="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" \
            --title "$PR_TITLE" --body-file "$body" 2>&1)"; then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qi "not permitted to create or approve pull requests"; then
              echo "::error::Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow."
            else
              echo "::error::Could not open the upstream sync pull request."
            fi
            exit 1
          else
            printf '%s\n' "$output"
          fi

          issues="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.ISSUE_TITLE) | .number')"
          issue="${issues%%$'\n'*}"
          if [ -n "$issue" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" \
              -f "body=Upstream now merges cleanly; see the \`$SYNC_BRANCH\` pull request." > /dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=closed -f state_reason=completed > /dev/null
            echo "Closed issue #$issue."
          fi

      - name: Dispatch CI on sync branch
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pull-request-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
